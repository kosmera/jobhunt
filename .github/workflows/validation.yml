name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  JOBHUNT_AUTO_MIGRATE: "0"
  JOBHUNT_DEBUG: "1"
  JOBHUNT_AUTH_MODE: local

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.15"
          python-version: "3.12"
          enable-cache: true
      - name: Install core dependencies
        run: uv sync --locked --all-extras
      - name: Run pre-commit checks
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jobhunt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobhunt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOBHUNT_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://postgres:postgres@localhost:5432/jobhunt' || 'sqlite:///:memory:' }}
      COPILOT_ENABLED: "1"
      IS_SAAS_PRODUCTION: "False"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.15"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Django system checks
        run: uv run --no-sync python manage.py check
      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: uv run --no-sync python manage.py test accounts tracker jobhunt rls jobhunt_ai --noinput

  core-only:
    name: Core without the copilot (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBHUNT_DATABASE_URL: "sqlite:///:memory:"
      COPILOT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.15"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Django system checks
        run: uv run --no-sync python manage.py check
      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Run core tests
        run: uv run --no-sync python manage.py test accounts tracker jobhunt rls --noinput
