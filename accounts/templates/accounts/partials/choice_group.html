{% comment %}A multiple-choice field drawn as toggle chips: the question as legend, the boxes inside.{% endcomment %}
<fieldset class="choice-group">
  <legend class="field__label">{{ field.label }}</legend>
  {{ field }}
  {% if field.help_text %}<span class="field__help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
</fieldset>
