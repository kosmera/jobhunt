[project]
name = "jobhunt"
version = "1.0.0"
description = "Suivi de candidatures — Django + HTMX, en remplacement du tableur"
requires-python = ">=3.12"

dependencies = [
    "django>=6.1,<7",
    "openpyxl>=3.1.5",   # lecture du classeur d'origine (commande import_legacy)
    "pypdf>=5",          # texte des CV PDF (port de stockage, extract_and_anonymize_text)
    "python-docx>=1.1",  # texte des CV DOCX, rendu des CV ATS générés
    "django-q2>=1.11.1,<2",             # file durable partagée : e-mails et copilote
    # Copilote IA (app jobhunt_ai, activée par COPILOT_ENABLED) :
    # SDK Anthropic (sorties structurées), orchestration des agents, veille.
    "anthropic>=1.0,<2",                # SDK officiel : messages.parse + sorties structurées
    "langgraph>=1.0,<2",                # orchestration des agents (graphes d'états)
    "pydantic>=2.7",
    "openai>=2,<3",                     # OpenAI direct et Azure OpenAI : sorties structurées
    "httpx>=0.27",                      # récupération directe des pages (repli de la veille)
    "beautifulsoup4>=4.12",
    "langchain-mcp-adapters>=0.3,<0.4", # veille : serveur MCP Bright Data
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.2",
]
# Fichiers sur Azure Blob Storage (JOBHUNT_STORAGE_PROVIDER=azure) ; ajoute
# azure-identity pour une identité managée à la place d'une clé de compte.
azure = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.19",
]
# Service web. Rien de tout ça ne sert en local : « runserver » est son propre
# serveur et sert les statiques lui-même tant que DEBUG est vrai. En production
# gunicorn porte l'application, et whitenoise sert /static/ — App Service ne met
# aucun serveur de fichiers devant Django.
deploy = [
    "gunicorn>=23",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pyflakes>=3.4",     # vérification des imports et variables inutilisés
    "django-stubs>=6.1", # types Django pour Pylance/Pyright (« .objects », QuerySet)
    "requests>=2.31",    # tests d'intégration du stockage Azure contre l'émulateur Azurite
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Disposition « à plat » : sans filtre, setuptools prendrait media/, static/,
# Offres/ et CV_base/ pour des paquets et refuserait de construire.
include = ["jobhunt*", "accounts*", "tracker*", "rls*", "jobhunt_ai*"]

[tool.uv]
# Application Django, pas une bibliothèque : « uv sync » n'installe pas le
# projet lui-même (« uv pip install -e . » reste possible si besoin).
package = false

[tool.pyright]
# Résout Django et les types de django-stubs dans le .venv du projet, quel que
# soit l'interpréteur sur le PATH (Pylance, pyright en ligne de commande).
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["jobhunt", "accounts", "tracker", "rls", "jobhunt_ai", "scripts", "manage.py"]
# Les états LangGraph du copilote sont des TypedDict total=False lus par clé.
reportTypedDictNotRequiredAccess = "none"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Syntax, import, and correctness checks, including the existing Pyflakes rules.
select = ["E4", "E7", "E9", "F"]
